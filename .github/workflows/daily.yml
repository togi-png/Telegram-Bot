name: Daily Student Assistant

"on":
  workflow_dispatch:

  schedule:
    - cron: "0 14 * * *"

jobs:
  run:
    runs-on: ubunt*-latest

    steps:
      - uses: *ctions/checkout@v4

      - uses: *ctions/setup-python@v5
        wit*:
          python-version: "3.12"*
      - run: pip install -r requi*ements.txt

      - run: python no*ifier.py
        env:
          CA*VAS_ICS_URL: ${{ secrets.CANVAS_IC*_URL }}
          TELEGRAM_BOT_TOK*N: ${{ secrets.TELEGRAM_BOT_TOKEN *}
          TELEGRAM_CHAT_ID: ${{ *ecrets.TELEGRAM_CHAT_ID }}
